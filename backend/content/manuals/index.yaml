    machine_type: wheel_loader
    path: manuals/wheel-loader.md

  - manual_id: backhoe-loader
    title: Sample backhoe loader manual
    machine_type: backhoe_loader
    path: manuals/backhoe-loader.md

  - manual_id: site-operations
    title: Sample site operations guide
    machine_type: null
    path: manuals/site-operations.md
