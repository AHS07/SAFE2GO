<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" preserveAspectRatio="xMidYMid slice">
  <!-- Illustrative work-site view from the cab. Local file so the cockpit works offline. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b4a5c"/>
      <stop offset="0.6" stop-color="#7d8896"/>
      <stop offset="1" stop-color="#a39a88"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6e5f4a"/>
      <stop offset="1" stop-color="#3a3128"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a7a62"/>
      <stop offset="1" stop-color="#5c4f3d"/>
    </linearGradient>
    <linearGradient id="pile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9b8766"/>
      <stop offset="1" stop-color="#5e4e3a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#sky)"/>

  <!-- Distant ridge and quarry face -->
  <path d="M0 300 L140 250 L300 275 L460 220 L640 262 L820 214 L1000 255 L1200 228 L1200 400 L0 400 Z" fill="#59616b" opacity="0.7"/>
  <path d="M0 360 L180 300 L360 322 L520 280 L700 318 L900 286 L1200 330 L1200 470 L0 470 Z" fill="url(#face)"/>
  <path d="M180 300 L200 470 M520 280 L540 470 M900 286 L915 470" stroke="#4b4033" stroke-width="3" opacity="0.5"/>

  <!-- Working floor -->
  <path d="M0 440 Q600 410 1200 440 L1200 675 L0 675 Z" fill="url(#ground)"/>
  <path d="M120 675 Q420 520 600 470 M1080 675 Q780 520 600 470" stroke="#2e2720" stroke-width="10" fill="none" opacity="0.45"/>

  <!-- Spoil pile -->
  <path d="M760 470 Q860 360 960 380 Q1040 395 1110 470 Z" fill="url(#pile)"/>

  <!-- Haul truck, side view -->
  <g transform="translate(250 395)" fill="#b89c3a" stroke="#1d1f22" stroke-width="3">
    <path d="M0 40 L150 40 L170 0 L0 0 Z"/>
    <path d="M150 40 L150 10 L195 10 L210 40 Z" fill="#8f7a2e"/>
    <rect x="160" y="16" width="26" height="14" fill="#2b3440"/>
    <circle cx="35" cy="55" r="18" fill="#1d1f22"/>
    <circle cx="80" cy="55" r="18" fill="#1d1f22"/>
    <circle cx="185" cy="55" r="18" fill="#1d1f22"/>
  </g>

  <!-- Excavator boom and bucket reaching into the pile, seen from the cab -->
  <g stroke="#1d1f22" stroke-width="4" stroke-linejoin="round">
    <path d="M1200 675 L1200 560 L1010 330 L975 345 L1140 600 Z" fill="#c9a227"/>
    <path d="M1010 330 L900 470 L925 482 L1030 350 Z" fill="#b08d1f"/>
    <path d="M880 460 Q870 510 915 520 L950 500 L925 470 Z" fill="#3a3a3a"/>
    <path d="M1080 470 L1025 380" stroke="#8c8c8c" stroke-width="10"/>
  </g>

  <!-- Cab frame edges -->
  <path d="M0 0 L60 0 L40 675 L0 675 Z" fill="#101317" opacity="0.9"/>
  <path d="M0 0 L1200 0 L1200 26 L0 40 Z" fill="#101317" opacity="0.9"/>
</svg>
