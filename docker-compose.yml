services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: safe2go
      POSTGRES_PASSWORD: safe2go
      POSTGRES_DB: safe2go
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
